name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (x.y.z, becomes the tag)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        run: node scripts/version-bump.mjs "$VERSION"

      - name: Pin islands runtime to the latest marimo release
        run: node scripts/pin-islands.mjs

      - name: Build
        run: pnpm build

      - name: Commit version bump and islands pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json versions.json src/main.ts
          git diff --cached --quiet || git commit -m "chore: release $VERSION"
          git push

      - name: Tag the release commit
        run: |
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" --title "$VERSION" --draft main.js manifest.json styles.css
